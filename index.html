<title>Digitale Umkleide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  /* Layout: App-Rahmen – Kopfzeile · Ansicht · Tab-Leiste. Die Anprobe ist eine Umkleidekabine: Spiegel-Bühne, Kategorie-Leiste rechts, Ablage mit Teilen darunter. */
  --bg: #e5e8ec;
  --surface: #f4f5f7;
  --raised: #ffffff;
  --ink: #121a24;
  --ink-2: #3a4553;
  --muted: #5f6a77;
  --line: #d2d8de;
  --line-2: #b9c1ca;
  --tape: #eebd2b;
  --tape-ink: #241d05;
  --tape-soft: #f8ecc0;
  --primary: #15223a;
  --primary-ink: #ffffff;
  --danger: #b0261f;
  --ok: #24724a;
  --stage-a: #eff2f5;
  --stage-b: #d4dae2;
  --check-a: #ffffff;
  --check-b: #e7eaee;
  --sw-ring: rgba(18, 26, 36, .18);
  --scrim: rgba(10, 14, 20, .46);
  --glass: rgba(244, 245, 247, .88);
  --shadow-1: 0 1px 2px rgba(18, 26, 36, .06), 0 6px 18px rgba(18, 26, 36, .07);
  --shadow-2: 0 -8px 40px rgba(18, 26, 36, .18);
  --font-display: "Bodoni Moda", "Bodoni 72", Didot, "Times New Roman", serif;
  --font-ui: "Instrument Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1217; --surface: #151a21; --raised: #1c222b; --ink: #e8ecf1; --ink-2: #c4ccd6; --muted: #97a2af;
    --line: #29313b; --line-2: #3b4550; --tape: #f2c641; --tape-ink: #1c1603; --tape-soft: #3a3117;
    --primary: #e8ecf1; --primary-ink: #0e1217; --danger: #f0756c; --ok: #5cc28a;
    --stage-a: #1d232c; --stage-b: #11161c; --check-a: #232a33; --check-b: #1a2028; --sw-ring: rgba(255, 255, 255, .24);
    --scrim: rgba(0, 0, 0, .6); --glass: rgba(21, 26, 33, .88);
    --shadow-1: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 22px rgba(0, 0, 0, .3); --shadow-2: 0 -8px 40px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1217; --surface: #151a21; --raised: #1c222b; --ink: #e8ecf1; --ink-2: #c4ccd6; --muted: #97a2af;
  --line: #29313b; --line-2: #3b4550; --tape: #f2c641; --tape-ink: #1c1603; --tape-soft: #3a3117;
  --primary: #e8ecf1; --primary-ink: #0e1217; --danger: #f0756c; --ok: #5cc28a;
  --stage-a: #1d232c; --stage-b: #11161c; --check-a: #232a33; --check-b: #1a2028; --sw-ring: rgba(255, 255, 255, .24);
  --scrim: rgba(0, 0, 0, .6); --glass: rgba(21, 26, 33, .88);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 22px rgba(0, 0, 0, .3); --shadow-2: 0 -8px 40px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

html { height: 100%; box-sizing: border-box; background: var(--surface); }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; margin: 0; overflow: hidden; background: var(--surface); color: var(--ink); font: 400 15px/1.45 var(--font-ui); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
img { max-width: 100%; }
:focus-visible { outline: 2px solid var(--tape); outline-offset: 2px; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
h1, h2, h3 { text-wrap: balance; }

/* ---------- Rahmen ---------- */
.app { height: 100%; max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; background: var(--bg); }
@media (min-width: 721px) { .app { border-left: 1px solid var(--line); border-right: 1px solid var(--line); } }
.topbar { background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-in { display: flex; align-items: center; gap: 8px; min-height: 56px; padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.title-block { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.brand { font: italic 500 12px/1 var(--font-display); color: var(--muted); letter-spacing: .03em; }
.view-title { margin: 2px 0 0; font: 500 26px/1.05 var(--font-display); letter-spacing: -.01em; }
.top-actions { display: flex; align-items: center; gap: 4px; }
.notice { display: flex; align-items: center; gap: 8px; background: var(--tape-soft); color: var(--ink); font-size: 13px; padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
.notice span { flex: 1; min-width: 0; }
.notice-x { width: 30px; height: 30px; flex: 0 0 auto; border: 0; border-radius: 8px; background: transparent; color: var(--ink); display: grid; place-items: center; padding: 0; }
.notice-x svg { width: 16px; height: 16px; }
.views { flex: 1; min-height: 0; position: relative; }
.view { position: absolute; inset: 0; }
.view-scroll { overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.view-pad { display: flex; flex-direction: column; gap: 22px; padding-block: 16px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tabbar { background: var(--surface); border-top: 1px solid var(--line); }
.tabbar-in { display: grid; grid-template-columns: repeat(4, 1fr); padding-block: 4px 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0 5px; border: 0; background: none; color: var(--muted); font-size: 11.5px; font-weight: 500; position: relative; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 600; }
.tab[aria-selected="true"]::after { content: ""; position: absolute; bottom: 0; width: 22px; height: 3px; border-radius: 2px; background: var(--tape); }

/* ---------- Bausteine ---------- */
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border: 0; border-radius: 12px; background: transparent; color: var(--ink); flex: 0 0 auto; }
.icon-btn:hover { background: var(--bg); }
.icon-btn svg { width: 22px; height: 22px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--raised); color: var(--ink); font-weight: 600; font-size: 15px; line-height: 1.1; text-align: center; }
.btn svg { width: 19px; height: 19px; flex: 0 0 auto; }
.btn-sm { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn-primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn-magic { background: var(--tape); border-color: var(--tape); color: var(--tape-ink); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-danger { color: var(--danger); }
.btn-wide { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.label { margin: 0; font-size: 11.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.fset { display: flex; flex-direction: column; gap: 10px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line-2); background: var(--raised); color: var(--ink); border-radius: 999px; padding: 7px 13px; font-size: 14px; font-weight: 500; line-height: 1.2; }
.chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.chip .n { opacity: .6; font-weight: 500; margin-left: 2px; }
.chips-scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips-scroll .chip { flex: 0 0 auto; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line-2); border-radius: 12px; overflow: hidden; background: var(--raised); }
.seg button { border: 0; background: transparent; padding: 8px 12px; font-size: 13.5px; font-weight: 500; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); }
.field { width: 100%; min-height: 44px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--raised); padding: 10px 12px; font-size: 16px; }
textarea.field { resize: vertical; line-height: 1.4; }
.field-sm { min-height: 38px; padding: 7px 10px; font-size: 15px; border-radius: 10px; }
.hint { margin: 0; font-size: 13.5px; color: var(--muted); }
.swatches { display: flex; flex-wrap: wrap; gap: 9px; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 0; padding: 0; background: var(--c); box-shadow: inset 0 0 0 1px var(--sw-ring); position: relative; }
.sw[aria-pressed="true"] { box-shadow: inset 0 0 0 1px var(--sw-ring), 0 0 0 2px var(--bg), 0 0 0 4px var(--ink); }
.sw-bunt, .dots i.bunt { background: conic-gradient(#e8823a, #f1d04a, #3f8a52, #2f62b8, #7a4ea3, #df4f8b, #e8823a); }

/* ================= Sheets ================= */
const sheets = [];
function openSheet({ title, html, foot = '', cls = '', onMount, onClose, onAct }) {
  const z = 100 + sheets.length * 2;
  const scrim = document.createElement('div'); scrim.className = 'sheet-scrim'; scrim.style.zIndex = z;
  const el = document.createElement('section'); el.className = 'sheet ' + cls; el.style.zIndex = z + 1;
  el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', title);
  el.innerHTML = `<div class="sheet-grip"></div><header class="sheet-head"><h2 class="sheet-title">${esc(title)}</h2><button class="icon-btn" data-sheet-close aria-label="Schließen">${I.x}</button></header><div class="sheet-body">${html}</div>${foot ? `<footer class="sheet-foot">${foot}</footer>` : ''}`;
  document.body.append(scrim, el);
  const rec = { el, scrim, onClose, closed: false, body: el.querySelector('.sheet-body') };
  sheets.push(rec);
  scrim.addEventListener('click', () => closeSheet(rec));
  el.addEventListener('click', (e) => {
    if (e.target.closest('[data-sheet-close]')) { closeSheet(rec); return; }
    const b = e.target.closest('[data-sact]'); if (b && onAct) onAct(b.dataset.sact, b, e, rec);
  });
  requestAnimationFrame(() => requestAnimationFrame(() => { scrim.classList.add('open'); el.classList.add('open'); }));
  if (onMount) onMount(el, rec);
  return rec;
}
function closeSheet(rec = sheets[sheets.length - 1], force = false) {
  if (!rec || rec.closed) return;
  if (!force && rec.onClose && rec.onClose() === false) return;
  rec.closed = true; sheets.splice(sheets.indexOf(rec), 1);
  rec.el.classList.remove('open'); rec.scrim.classList.remove('open');
  setTimeout(() => { rec.el.remove(); rec.scrim.remove(); }, 300);
}
const closeAllSheets = () => { while (sheets.length) closeSheet(sheets[sheets.length - 1], true); };

  items.forEach(([id, d]) => { if (d && typeof d === 'object') Store.mem.items.set(id, d); });
  looks.forEach(([id, d]) => { if (d && typeof d === 'object') Store.mem.looks.set(id, d); });
  const prof = meta.find(([k]) => k === 'profile'); Store.mem.profile = prof ? prof[1] : null;
  if (!meta.some(([k]) => k === 'schema')) { try { await IDB.put('meta', 'schema', 1); } catch (e) { /* nicht kritisch */ } }
  Store.mode = 'local'; Store.canUpload = true;
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* optional */ }

}

    const day = new Date().toISOString().slice(0, 10);
    const how = await saveFile(`Umkleide-Look-${day}.jpg`, blob);
    toast(how === 'shared' ? 'Tippe auf „Bild sichern“, dann landet der Look in deinen Fotos.' : 'Bild gespeichert', 4000);
  } catch (e) {
    const c = e && e.code;
    if (isCancel(e)) return;
    toast(c === 'rate_limited' ? 'Es ist schon ein Speichern-Dialog offen.' : 'Das Bild konnte nicht gespeichert werden.');
  }
}

/* ================= Eigenes Foto ================= */
async function onPhotoFile(file) {
  if (!file) return;
  toast('Foto wird vorbereitet…', 6000);
  try {
    const c = await fileToCanvas(file, 1600); const t = scaleCanvas(c, 640);
    const [b1, b2] = await Promise.all([canvasBlob(c, false, 0.88), canvasBlob(t, false, 0.82)]);
    const id = await Store.upload(b1); const tid = await Store.upload(b2);
    const old = [S.profile.photoId, S.profile.photoThumbId];
    S.useMannequin = false; LS.set('mannequin', false);
    await saveProfile({ photoId: id, photoThumbId: tid, photoW: c.width, photoH: c.height, guides: defaultGuidesFor(c.width, c.height) });
    old.forEach((o) => Store.delAsset(o));
    toast('Foto gespeichert. Jetzt kurz die Körperpunkte setzen.', 3500);
    enterGuides();
  } catch (e) {
    const code = e && e.code;
    toast(code === 'quota_or_state' || code === 'local_full' ? 'Der Speicher ist voll.' : code ? 'Hochladen hat nicht geklappt. Versuch es noch einmal.' : 'Dieses Foto kann der Browser nicht öffnen. Versuch ein JPG.', 4200);
  }
}
async function autoGuides() {
  if (!aiImagesOn() || S.guidesBusy) return;
  S.guidesBusy = true; renderStageUi();
  try {
    const c = await urlToCanvas(curP.src, 1024); const blob = await canvasBlob(c, false, 0.85);
    const g = await aiBody(blob);
    if (g && S.guidesMode) { S.guidesDraft = g; curP = photoInfo(); renderGuides(); updateLayers(); toast('Punkte gesetzt – prüf kurz, ob sie passen.'); }
    else if (!g) toast('Keine Person sicher erkannt. Setz die Punkte bitte von Hand.', 3800);
  } catch (e) { toast(aiErrorText(aiFail(e))); }
  S.guidesBusy = false; if (S.guidesMode) renderStageUi();
}

/* ================= Klicks ================= */
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, id = b.dataset.id, k = b.dataset.k;
  switch (a) {
    case 'tab': closeAllSheets(); switchTab(b.dataset.tab); break;
    case 'rail': S.railCat = b.dataset.cat; renderRail(); renderTray(); $('#trayRow').scrollLeft = 0; break;
    case 'wear': toggleWear(id); break;
    case 'add-items': pickFile('clothes', b.dataset.cat || ''); break;
    case 'pick-photo': pickFile('photo'); break;
    case 'mirror-menu': openMirrorMenu(); break;
    case 'save-look': openSaveLook(); break;
    case 'style-rest': {
      const must = S.sel ? [S.sel] : S.worn.filter((x) => getItem(x));
      S.st.must = must; S.st.results = []; S.st.error = ''; S.sel = null;
      switchTab('stylist', { top: true });
      toast(must.length ? 'Diese Teile sind gesetzt – wähle Anlass und los.' : 'Wähle Anlass und Farben.');
      break;
    }
    case 'ly-up': case 'ly-down': case 'ly-flip': case 'ly-reset': case 'ly-off': layerAction(a); break;
    case 'guides-done': exitGuides(true); toast('Körperpunkte gespeichert'); break;
    case 'guides-auto': autoGuides(); break;
    case 'edit-style': openStyleSheet(); break;
    case 'st-occ': S.st.occ = k; S.st.occText = $('#occText') ? $('#occText').value : S.st.occText; renderStylist(); break;
    case 'st-cmode': S.st.colorMode = k; renderStylist(); break;
    case 'st-color': { const c = S.st.colors; S.st.colors = c.includes(k) ? c.filter((x) => x !== k) : [...c, k].slice(-3); renderStylist(); break; }
    case 'st-wx': S.st.weather = k; renderStylist(); break;
    case 'st-unmust': S.st.must = S.st.must.filter((x) => x !== id); renderStylist(); break;
    case 'pick-must': openPicker(); break;
    case 'generate': if ($('#occText')) S.st.occText = $('#occText').value; generate(); break;
    case 'st-stop': if (S.st.ctl) S.st.ctl.abort(); break;
    case 'res-try': { const o = findResult(b.dataset.key); if (!o) break; S.worn = o.ids.filter((x) => getItem(x)); S.sel = null; if (isDemo()) LS.set('demoTouched', true); persistWorn(); switchTab('anprobe'); break; }
    case 'res-save': { const o = findResult(b.dataset.key); if (!o) break; if (o.ids.some((x) => (getItem(x) || {}).demo)) { toast('Speichern geht mit deinen eigenen Teilen. Lade zuerst Fotos hoch.', 3800); break; } b.disabled = true; Store.putLook(rid(), { title: o.title, occ: o.occ || '', ids: o.ids, why: o.why || '', tip: o.tip || '', source: 'stylist', createdAt: Date.now() }).then(() => { S.st.saved.add(o.key); toast('Look gespeichert'); if (S.tab === 'stylist') { const card = $(`.outfit[data-key="${o.key}"]`); if (card) card.outerHTML = outfitCardHTML(o); } }).catch(() => { b.disabled = false; }); break; }
    case 'res-no': {
      const o = findResult(b.dataset.key); if (!o) break;
      S.st.results = S.st.results.filter((x) => x !== o);
      if (!o.ids.some((x) => (getItem(x) || {}).demo)) { const dl = [...(S.profile.dislikes || []), { ids: o.ids, title: o.title, at: Date.now() }].slice(-20); saveProfile({ dislikes: dl }).catch(() => {}); }
      toast('Verstanden – solche Kombinationen schlage ich seltener vor.'); renderStylist(); break;
    }
    case 'open-item': openItemSheet(id); break;
    case 'open-look': openLookSheet(id); break;
    case 'sk-cat': S.sf.cat = k; LS.set('skCat', k); renderSchrankGrid(); break;
    case 'sk-color': S.sf.color = S.sf.color === k ? null : k; renderSchrankGrid(); break;
    case 'notice-x': LS.set('noticeHidden', S.notice); renderNotice(); break;
    case 'backup-save': exportBackup(b); break;
    case 'backup-load': { const inp = $('#fileBackup'); inp.value = ''; inp.click(); break; }
    case 'sk-clear': S.sf = { cat: 'all', color: null, q: '' }; if ($('#skSearch')) $('#skSearch').value = ''; renderSchrankGrid(); break;
    default: break;
  }
});
document.addEventListener('input', (e) => { if (e.target.id === 'occText') S.st.occText = e.target.value; });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (sheets.length) { closeSheet(); return; } if (S.guidesMode) { exitGuides(false); return; } if (S.sel) selectLayer(null); return; }
  if (sheets.length || S.tab !== 'anprobe' || !S.sel || /input|textarea|select/i.test((document.activeElement || {}).tagName || '')) return;
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); layerAction('ly-off'); return; }
  const step = e.shiftKey ? 0.1 : 0.02; const mv = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
  if (mv) { e.preventDefault(); const f = fitOf(S.sel); setFit(S.sel, { ...f, dx: (f.dx || 0) + mv[0], dy: (f.dy || 0) + mv[1] }); scheduleFitSave(S.sel); }
});
$('#fileClothes').addEventListener('change', (e) => { const fs = e.target.files; if (fs && fs.length) startImport(fs, pendingPick.cat); });
$('#filePhoto').addEventListener('change', (e) => { const f = e.target.files && e.target.files[0]; if (f) onPhotoFile(f); });
$('#fileBackup').addEventListener('change', (e) => { const f = e.target.files && e.target.files[0]; if (f) importBackupFile(f); });

/* ================= Start ================= */
function startMemory(reason) {
  Store.mode = 'memory'; Store.canUpload = true;
  S.notice = reason === 'signedout' ? 'Melde dich an, damit dein Schrank gespeichert wird. Bis dahin geht nichts verloren, solange diese Seite offen ist.'
    : reason === 'nodb' ? 'Speichern ist in dieser Ansicht nicht verfügbar. Alles bleibt nur, solange die Seite offen ist.'
    : 'Vorschau: Fotos und Looks bleiben nur, solange diese Seite offen ist.';
  S.itemsLoaded = true; S.looksLoaded = true; S.profileLoaded = true; S.hasItemsHint = false; S.hasPhotoHint = false;
}
async function init() {
  S.hasItemsHint = !!LS.get('hasItems', false); S.hasPhotoHint = !!LS.get('hasPhoto', false);
  S.useMannequin = !!LS.get('mannequin', false);
  const savedWorn = LS.get('worn', []); S.worn = Array.isArray(savedWorn) ? savedWorn.filter((x) => typeof x === 'string') : [];
  const stp = LS.get('st', null); if (stp && OCC[stp.occ]) { S.st.occ = stp.occ; if (stp.colorMode === 'akzent') S.st.colorMode = 'akzent'; }
  const skc = LS.get('skCat', 'all'); if (skc === 'all' || CAT[skc]) S.sf.cat = skc;
  let start = LS.get('tab', 'anprobe'); const h = (location.hash || '').slice(1); if (TABS.includes(h)) start = h;
  renderTabs(); initStageGestures();
  if (window.ResizeObserver) new ResizeObserver(() => { if (S.tab === 'anprobe') { sizeStage(); renderGuides(); } }).observe($('#stageWrap'));
  reconcileWorn(); switchTab(TABS.includes(start) ? start : 'anprobe');

  const cl = window.claude;
  if (!cl || typeof cl.use !== 'function') { await startDevice('standalone'); return; }
  const names = ['db', 'user', 'assets', 'sample', 'downloads'];
  const caps = await Promise.all(names.map((n) => Promise.resolve().then(() => cl.use(n)).catch(() => null)));
  const [db, user, assets, sample, downloads] = caps;
  AI.fn = sample || null; DL.fn = downloads || null;
  if (AI.fn) { try { const lim = await AI.fn.limits(); AI.images = !!(lim && lim.images); AI.maxImages = clamp((lim && lim.images && lim.images.maxCount) || 1, 1, 6); } catch (e) { AI.images = false; } }
  let uid = null; if (user) { try { uid = await user.id(); } catch (e) { uid = null; } }
  if (db && uid && assets) {
    Store.mode = 'cloud'; Store.db = db; Store.uid = uid; Store.assets = assets; Store.canUpload = true;
    subscribeCloud();
    renderNotice(); renderHeader(); renderView();
  } else await startDevice(db && uid ? 'guest' : 'nodb');
}
async function startDevice(reason) {
  try {
    await startLocal();
    const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const inSafariTab = reason === 'standalone' && ios && navigator.standalone === false;
    S.notice = inSafariTab
      ? 'Leg die App auf den Home-Bildschirm (Teilen → „Zum Home-Bildschirm“) und öffne sie nur dort. Safari und die Home-Bildschirm-App speichern getrennt.'
      : 'Dein Schrank wird nur auf diesem Gerät gespeichert. Speichere ab und zu eine Sicherung – im Schrank ganz unten.';
    const prevV = LS.get('appVersion', null);
    if (prevV && prevV !== APP_VERSION && (Store.mem.items.size || Store.mem.looks.size)) setTimeout(() => toast(`App aktualisiert auf Version ${APP_VERSION} – deine Sachen sind alle noch da.`, 4500), 600);
    LS.set('appVersion', APP_VERSION);
  } catch (e) { startMemory(reason === 'standalone' ? 'preview' : reason); }
  reconcileWorn(); renderNotice(); renderHeader(); renderView();
}
init();

})();
</script>
